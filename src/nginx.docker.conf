# Docker-DNS load balancing variant.
# In Docker Compose, the service name "app" resolves to all replicas via DNS
# round-robin, so Nginx's upstream simply points at it. No sticky sessions —
# auth is a stateless JWT cookie.

upstream mock_mentor_backend {
    least_conn;
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5M;

    # Next.js built assets (served from the app image's public volume)
    location /_next/static/ {
        proxy_pass http://mock_mentor_backend;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Uploaded files (shared volume across replicas)
    location /uploads/ {
        proxy_pass http://mock_mentor_backend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://mock_mentor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check passthrough -> /api/v1/status
    location = /health {
        proxy_pass http://mock_mentor_backend/api/v1/status;
        access_log off;
    }
}
