# ==========================================================================
# Mock Mentor — Load Balancer (Nginx)
#
# Run multiple Next.js instances (PM2 cluster or Docker) and let Nginx
# distribute traffic across them. Auth is stateless (JWT cookie), so NO
# sticky sessions are needed — any instance can serve any request.
#
# Usage (self-hosted):
#   1. npm run build && npm run start:cluster   # starts instances on :3000
#      (PM2 cluster shares one port; for separate ports, scale via Docker)
#   2. Place this file at /etc/nginx/sites-available/mock-mentor and symlink
#      into sites-enabled, then: nginx -t && systemctl reload nginx
#
# Health check target: GET /api/v1/status  (returns 200 when DB is up)
# ==========================================================================

upstream mock_mentor_backend {
    # least_conn sends new requests to the instance with the fewest active
    # connections — better than round_robin for uneven request costs.
    least_conn;

    # List each Next.js instance. With PM2 cluster on one host, they share
    # port 3000 (the OS balances); for true multi-instance, expose separate
    # ports or containers and list them here:
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production (configure certs separately)
    # return 301 https://$host$request_uri;

    client_max_body_size 5M;  # allow avatar uploads

    # ---- Static assets served directly by Nginx (offloads app servers) ----
    # Next.js built assets
    location /_next/static/ {
        alias /app/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # User-uploaded files (point UPLOAD_DIR at a shared volume in prod!)
    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- Application (SSR + API) ----
    location / {
        proxy_pass http://mock_mentor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR support (dev); harmless in prod
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering for API responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # ---- Health check passthrough (LB can hit this directly) ----
    location = /health {
        proxy_pass http://mock_mentor_backend/api/v1/status;
        access_log off;
    }
}

# Example HTTPS server (uncomment after configuring certs with e.g. certbot)
# server {
