# ==========================================================================
# Mock Mentor — full scalable stack
#
#   docker compose up -d --build
#   docker compose up -d --scale app=3      # scale app instances on demand
#
# Components:
#   - app:    Next.js (next start), scaled horizontally
#   - nginx:  load balancer in front of the app replicas (no sticky sessions)
#   - redis:  shared cache + rate-limit store (multi-instance safe)
#   - db:     MySQL (use a managed instance in real production)
#
# Health: nginx hits /health -> /api/v1/status on each app instance.
# ==========================================================================

version: "3.9"

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-mock_mentor}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DATABASE_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-root}
      DATABASE_NAME: ${DATABASE_NAME:-mock_mentor}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_URL: ${APP_URL:-http://localhost}
      UPLOAD_DIR: /app/public/uploads
      DB_CONNECTION_LIMIT: "10"
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
    volumes:
      # Shared uploads volume so any replica can read/write avatars.
      - uploads_data:/app/public/uploads
    deploy:
      replicas: 2
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx.docker.conf uses `app:3000` — Docker DNS round-robins across replicas.

volumes:
  db_data:
  redis_data:
  uploads_data:
